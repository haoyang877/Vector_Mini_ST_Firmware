schema_version = 1
python_version = "3.13"
zig_version = "0.16.0"
uv_version = "0.12.16"
keil_version = "5.36.0.0"
jlink_version = "9.64"
ruff_version = "0.13.2"
clang_format_version = "20.1.8"

[environment]
compiler = "HARNESS_CC"
keil = "KEIL_UV4"
motor_adapter_root = "MOTOR_CTRL_APP_ROOT"
cjk_font = "HARNESS_CJK_FONT"

[style]
line_length = 100
python_extensions = [".py"]
native_extensions = [".c", ".h", ".cc", ".cpp", ".hh", ".hpp"]
exclude_prefixes = [
  "firmware/third_party",
  "firmware/platform/stm32g4/cubemx",
  "host_app/.venv",
  "host_app/build",
  "host_app/dist",
  "outputs",
]

[style.modules.firmware]
paths = ["firmware"]

[style.modules.loader]
paths = ["loader"]

[style.modules.host_app]
paths = ["host_app"]

[style.modules.shared]
paths = ["shared"]

[style.modules.tooling]
paths = ["tools", "tests"]

[style.modules.templates]
paths = ["templates"]

[profiles.quick]
checks = ["format", "lint", "project-layout", "python-tests"]

[profiles.pr]
checks = ["format", "lint", "project-layout", "python-native-tests", "architecture", "interfaces", "docs", "hygiene"]

[profiles.release]
checks = ["format", "lint", "project-layout", "python-native-tests", "architecture", "interfaces", "docs", "hygiene", "keil-build", "release-manifest"]

[architecture.layers.common]
paths = ["firmware/common"]
allows = ["common"]

[architecture.layers.motor_math]
paths = ["firmware/motor/math"]
allows = ["motor_math"]

[architecture.layers.shared]
paths = ["shared"]
allows = ["shared"]

[architecture.layers.platform_api]
paths = ["firmware/platform/api"]
allows = ["platform_api"]

[architecture.layers.motor]
paths = ["firmware/motor"]
allows = ["motor_math", "platform_api", "motor", "shared"]

[architecture.layers.parameters]
paths = ["firmware/parameters"]
allows = ["motor_math", "platform_api", "motor", "parameters", "shared"]

[architecture.layers.app_interfaces]
paths = ["firmware/app/interfaces"]
allows = ["motor", "app_interfaces"]

[architecture.layers.protocol]
paths = ["firmware/communication/protocol"]
allows = ["motor", "parameters", "app_interfaces", "protocol", "shared"]

[architecture.layers.communication]
paths = ["firmware/communication/can"]
allows = ["platform_api", "motor", "parameters", "app_interfaces", "protocol", "communication", "shared"]

[architecture.layers.app]
paths = ["firmware/app"]
allows = ["target_profile", "motor_math", "platform_api", "motor", "parameters", "app_interfaces", "protocol", "communication", "app", "shared"]

[architecture.layers.platform_stm32]
paths = ["firmware/platform/stm32g4/bsp", "firmware/platform/stm32g4/ports"]
allows = ["target_profile", "platform_api", "motor", "parameters", "platform_stm32", "cubemx", "shared"]

[architecture.layers.cubemx]
paths = ["firmware/platform/stm32g4/cubemx/Core"]
allows = ["platform_api", "motor", "parameters", "app_interfaces", "protocol", "communication", "app", "platform_stm32", "cubemx"]


[architecture.layers.loader_api]
paths = ["loader/ports/include"]
allows = ["loader_api", "shared"]

[architecture.layers.loader_core]
paths = ["loader/core"]
allows = ["loader_core", "shared"]

[architecture.layers.loader_product]
paths = ["loader/product"]
allows = ["target_profile", "loader_product", "loader_api", "loader_target", "shared"]

[architecture.layers.loader_runtime]
paths = ["loader/runtime"]
allows = ["target_profile", "loader_runtime", "loader_core", "loader_product", "loader_api", "loader_target", "shared"]

[architecture.layers.loader_target]
paths = ["loader/targets"]
allows = ["target_profile", "loader_target", "shared"]

[architecture.layers.loader_mcu]
paths = ["loader/ports"]
allows = ["target_profile", "loader_mcu", "loader_api", "loader_board", "loader_target", "shared", "cubemx"]

[architecture.layers.loader_board]
paths = ["loader/boards"]
allows = ["loader_board", "shared", "cubemx"]

[architecture.layers.target_profile]
paths = ["shared/targets"]
allows = ["target_profile", "shared"]
