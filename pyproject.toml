[project]
name = "vector-mini-st-harness"
version = "0.1.0"
description = "Reproducible build, test, analysis, and HIL tooling for Vector Mini ST firmware"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
test = [
  "numpy==2.5.3",
]
analysis = [
  "matplotlib==3.11.2",
  "numpy==2.5.3",
]
bench = [
  "pyelftools==0.33",
  "pylink-square==2.0.1",
]
dev = [
  "clang-format==20.1.8",
  "matplotlib==3.11.2",
  "numpy==2.5.3",
  "pyelftools==0.33",
  "pylink-square==2.0.1",
  "ruff==0.13.2",
  "ziglang==0.16.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  "outputs",
  "firmware/third_party",
  "firmware/platform/stm32g4/cubemx",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
