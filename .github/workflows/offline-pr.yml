name: offline-pr

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked environment
        shell: pwsh
        run: |
          python -m pip install uv==0.12.16
          uv sync --locked --extra dev
      - name: Verify pull request profile
        shell: pwsh
        run: uv run python tools/run.py verify --profile pr
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-pr-evidence
          path: outputs/runs/
          if-no-files-found: error
