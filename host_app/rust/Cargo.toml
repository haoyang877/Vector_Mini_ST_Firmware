[package]
name = "yg_mc_host"
version = "2.1.2"
edition = "2024"
description = "YG_MC_HOST Windows CAN FD workbench"

[dependencies]
anyhow = "1"
crc32fast = "1"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
rand = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
