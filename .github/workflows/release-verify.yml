name: release-verify

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, keil, vector-mini-st]
    env:
      KEIL_UV4: ${{ vars.KEIL_UV4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked environment
        shell: pwsh
        run: |
          python -m pip install uv==0.12.16
          uv sync --locked --extra dev
      - name: Produce release evidence
        shell: pwsh
        run: uv run python tools/run.py verify --profile release
      - name: Upload immutable release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: |
            outputs/runs/
            outputs/build/keil/
          if-no-files-found: error
