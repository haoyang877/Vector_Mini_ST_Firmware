schema_version = 1
python_version = "3.13"
zig_version = "0.16.0"
uv_version = "0.12.16"
keil_version = "5.36.0.0"
jlink_version = "9.64"
ruff_version = "0.13.2"
clang_format_version = "20.1.8"

[environment]
compiler = "HARNESS_CC"
keil = "KEIL_UV4"
motor_adapter_root = "MOTOR_CTRL_APP_ROOT"
cjk_font = "HARNESS_CJK_FONT"

[style]
line_length = 100
python_extensions = [".py"]
native_extensions = [".c", ".h", ".cc", ".cpp", ".hh", ".hpp"]
exclude_prefixes = [
  "firmware/third_party",
  "firmware/platform/bsp/mcu/stm32g4/generated",
  "firmware/platform/sdk",
  "projects/stm32g4/MDK-ARM/RTE",
  "host_app/.venv",
  "host_app/build",
  "host_app/dist",
  "outputs",
]

[style.modules.firmware]
paths = ["firmware", "projects"]

[style.modules.loader]
paths = ["loader"]

[style.modules.host_app]
paths = ["host_app"]

[style.modules.shared]
paths = ["shared"]

[style.modules.tooling]
paths = ["tools", "tests"]

[style.modules.templates]
paths = ["templates"]

[profiles.quick]
checks = ["format", "lint", "project-layout", "python-tests"]

[profiles.pr]
checks = ["format", "lint", "project-layout", "python-native-tests", "architecture", "interfaces", "docs", "hygiene"]

[profiles.release]
checks = ["format", "lint", "project-layout", "python-native-tests", "architecture", "interfaces", "docs", "hygiene", "keil-build", "release-manifest"]

[architecture.layers.motor_math]
paths = ["firmware/motor/math"]
allows = ["motor_math"]

[architecture.layers.shared]
paths = ["shared"]
allows = ["shared"]

[architecture.layers.platform_api]
paths = ["firmware/platform/bsp/include"]
allows = ["platform_api", "platform_config"]

[architecture.layers.platform_config]
paths = ["firmware/config/board_config.h"]
allows = ["platform_config", "app_config"]

[architecture.layers.motor]
paths = ["firmware/motor"]
allows = ["motor_math", "platform_api", "motor", "shared", "platform_config", "app_config"]

[architecture.layers.parameters]
paths = ["firmware/parameters"]
allows = ["motor_math", "platform_api", "motor", "parameters", "shared", "platform_config", "app_config"]

[architecture.layers.app_interfaces]
paths = ["firmware/app/interfaces"]
allows = ["motor", "app_interfaces"]

[architecture.layers.communication]
paths = ["firmware/communication"]
allows = ["platform_api", "motor", "parameters", "app_interfaces", "communication", "shared"]

[architecture.layers.app]
paths = ["firmware/app"]
allows = ["target_profile", "motor_math", "platform_api", "motor", "parameters", "app_interfaces", "communication", "app", "shared", "platform_config", "app_config"]

[architecture.layers.platform_stm32]
paths = ["firmware/platform/bsp/mcu/stm32g4"]
allows = ["platform_internal", "target_profile", "platform_api", "motor", "parameters", "platform_stm32", "cubemx", "shared", "platform_config", "app_config"]

[architecture.layers.platform_at32]
paths = ["firmware/platform/bsp/mcu/at32f456"]
allows = ["platform_internal", "platform_api", "platform_config", "platform_at32", "app_config"]

# 应用仅可读取不含SDK类型的向量映射，不因此开放其它MCU实现头。
[architecture.layers.platform_interrupt_map]
paths = ["firmware/platform/bsp/mcu/stm32g4/interrupt_map.h", "firmware/platform/bsp/mcu/at32f456/interrupt_map.h"]
allows = []

[architecture.layers.stm32_application]
paths = ["projects/stm32g4/application"]
allows = ["platform_interrupt_map", "platform_api", "app", "cubemx", "platform_config", "app_config", "communication"]

[architecture.layers.at32_application]
paths = ["projects/at32f456/application"]
allows = ["at32_application", "platform_interrupt_map", "platform_api", "platform_at32", "platform_config", "app", "app_interfaces", "motor", "parameters", "target_profile", "communication", "app_config"]

[architecture.layers.at32_foundation]
paths = ["tests/bench/at32f456"]
# 独立台架入口是装配层；闭环验证直接复用motor，BSP仍禁止该依赖。
allows = ["platform_internal", "platform_api", "platform_at32", "platform_config", "motor_math", "motor", "at32_foundation", "app_config"]

[architecture.layers.cubemx]
paths = ["firmware/platform/bsp/mcu/stm32g4/generated/Core"]
allows = ["platform_api", "motor", "parameters", "app_interfaces", "communication", "app", "platform_stm32", "cubemx", "platform_config"]

[architecture.layers.loader_api]
paths = ["loader/ports/include"]
allows = ["loader_api", "shared"]

[architecture.layers.loader_core]
paths = ["loader/core"]
allows = ["loader_core", "shared"]

[architecture.layers.loader_product]
paths = ["loader/product"]
allows = ["target_profile", "loader_product", "loader_api", "loader_target", "shared"]

[architecture.layers.loader_runtime]
paths = ["loader/runtime"]
allows = ["target_profile", "loader_runtime", "loader_core", "loader_product", "loader_api", "loader_target", "shared"]

[architecture.layers.loader_target]
paths = ["loader/targets"]
allows = ["target_profile", "loader_target", "shared"]

[architecture.layers.loader_mcu]
paths = ["loader/ports"]
allows = ["target_profile", "loader_mcu", "loader_api", "loader_board", "loader_target", "shared", "cubemx"]

[architecture.layers.loader_board]
paths = ["loader/boards"]
allows = ["loader_board", "shared", "cubemx"]

[architecture.layers.target_profile]
paths = ["shared/targets"]
allows = ["target_profile", "shared"]

[architecture.layers.app_config]
paths = ["firmware/config"]
allows = ["app_config", "platform_config"]

[architecture.layers.platform_internal]
paths = ["firmware/platform/bsp/bsp_internal.h"]
allows = ["platform_api", "platform_config"]
