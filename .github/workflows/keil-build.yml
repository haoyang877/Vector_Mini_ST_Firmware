name: keil-build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  release-profile:
    runs-on: [self-hosted, Windows, X64, keil, vector-mini-st]
    env:
      KEIL_UV4: ${{ vars.KEIL_UV4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked environment
        shell: pwsh
        run: |
          python -m pip install uv==0.12.16
          uv sync --locked --extra dev
      - name: Build and verify release profile
        shell: pwsh
        run: uv run python tools/run.py verify --profile release
      - name: Upload build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keil-build-evidence
          path: |
            outputs/runs/
            outputs/build/
          if-no-files-found: error
